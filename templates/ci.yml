name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Ivan commits docs/CLAUDE.md updates straight to main outside a PR
    # (learning-coach, retrospective, discover, kickoff registry writes) —
    # skip re-running the gate for those doc-only pushes.
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Quality gate
        shell: pwsh
        run: ./gate.ps1
